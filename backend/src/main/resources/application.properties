# Generated by Auto (Composer) - 2026-05-21

app.name=PhotoFrame
server.port=8082
server.address=0.0.0.0
server.tomcat.connection-timeout=120000
server.tomcat.keep-alive-timeout=60000

# Source: local | google
# photoframe.source=${PHOTOFRAME_SOURCE:google}
photoframe.source=google

# Local folder (relative to photoframe project root or absolute path)
photoframe.local.folder=${PHOTOFRAME_LOCAL_FOLDER:./images}

# Default slideshow interval in seconds (overridable via URL ?interval=)
# photoframe.timer.seconds.default=${PHOTOFRAME_TIMER_SECONDS:5}
photoframe.timer.seconds.default=5

# Google Photos — OAuth credentials (not committed)
photoframe.google.credentials.path=${PHOTOFRAME_GOOGLE_CREDENTIALS:./google-photos-credentials.properties}

# Picker selection saved here for the slideshow
photoframe.google.picked.file=${PHOTOFRAME_GOOGLE_PICKED_FILE:./google-photos-picked.json}

# Local JPEG cache (downloaded on pick — slideshow uses these, not expiring Google URLs)
photoframe.google.cache.dir=${PHOTOFRAME_GOOGLE_CACHE_DIR:./google-photos-cache}

# Slideshow layout: width, height, x, y (px) — edited on /myphotoframe.html
photoframe.display.settings.file=${PHOTOFRAME_DISPLAY_SETTINGS:./slideshow-display.json}

# Logging (same system as BookForge — see logback-spring.xml)
# ============================================================
logging.file.name=logs/photoframe.log
logging.logback.rollingpolicy.file-name-pattern=logs/archive/photoframe.%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%15.15thread] %-5level %-40.40logger{39} : %msg%n%ex
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{50} - %msg%n%ex{full}
logging.level.root=INFO
# TRACE when LOG_LEVEL is unset; set LOG_LEVEL=INFO (or DEBUG) to reduce verbosity
logging.level.com.mwa.photoframe=${LOG_LEVEL:TRACE}
logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.web.servlet=INFO
logging.level.org.springframework.web.servlet.DispatcherServlet=INFO
logging.level.org.springframework.web.servlet.mvc=INFO
logging.level.org.springframework.web.servlet.handler=INFO
