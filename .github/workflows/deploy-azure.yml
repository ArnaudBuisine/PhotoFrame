name: Deploy PhotoFrame to Azure Container Instances

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub environment (secrets)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      storage_provider:
        description: 'Blob storage provider (storage-lib)'
        required: true
        default: 'azure'
        type: choice
        options:
          - azure
          - filesystem
      image_tag:
        description: 'Container image tag'
        required: false
        default: 'main'

env:
  AZURE_RESOURCE_GROUP: PhotoFrame
  AZURE_LOCATION: southeastasia
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/photoframe
  CONTAINER_NAME: photoframe
  DNS_LABEL: photoframe

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Remove existing container
        run: |
          az container delete -g "${{ env.AZURE_RESOURCE_GROUP }}" -n "${{ env.CONTAINER_NAME }}" --yes || true
          sleep 10

      - name: Deploy with Azure Blob storage
        if: inputs.storage_provider == 'azure'
        run: |
          az container create \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.CONTAINER_NAME }}" \
            --image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}" \
            --ip-address Public \
            --dns-name-label "${{ env.DNS_LABEL }}" \
            --ports 8082 \
            --location "${{ env.AZURE_LOCATION }}" \
            --os-type Linux \
            --cpu 1 \
            --memory 2.0 \
            --restart-policy Always \
            --registry-login-server "${{ env.REGISTRY }}" \
            --registry-username "${{ github.actor }}" \
            --registry-password "${{ secrets.GITHUB_TOKEN }}" \
            --environment-variables \
                PHOTOFRAME_HOME=/app \
                SERVER_PORT=8082 \
                LOGGING_FILE_NAME=/app/logs/photoframe.log \
                LOG_LEVEL=INFO \
                PHOTOFRAME_STORAGE_PROVIDER=azure \
                PHOTOFRAME_STORAGE_AZURE_CONTAINER=photoframe \
                PHOTOFRAME_STORAGE_GOOGLE_PREFIX=google-photos-cache \
                PHOTOFRAME_GOOGLE_CREDENTIALS=/app/google-photos-credentials.properties \
                PHOTOFRAME_GOOGLE_PICKED_FILE=/app/google-photos-picked.json \
                PHOTOFRAME_DISPLAY_SETTINGS=/app/slideshow-display.json \
                photoframe.source=google \
                GOOGLE_PHOTOS_CLIENT_ID="${{ secrets.GOOGLE_PHOTOS_CLIENT_ID }}" \
            --secure-environment-variables \
                AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
                GOOGLE_PHOTOS_CLIENT_SECRET="${{ secrets.GOOGLE_PHOTOS_CLIENT_SECRET }}" \
                GOOGLE_PHOTOS_REFRESH_TOKEN="${{ secrets.GOOGLE_PHOTOS_REFRESH_TOKEN }}"

      - name: Deploy with filesystem storage
        if: inputs.storage_provider == 'filesystem'
        run: |
          az container create \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.CONTAINER_NAME }}" \
            --image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}" \
            --ip-address Public \
            --dns-name-label "${{ env.DNS_LABEL }}" \
            --ports 8082 \
            --location "${{ env.AZURE_LOCATION }}" \
            --os-type Linux \
            --cpu 1 \
            --memory 2.0 \
            --restart-policy Always \
            --registry-login-server "${{ env.REGISTRY }}" \
            --registry-username "${{ github.actor }}" \
            --registry-password "${{ secrets.GITHUB_TOKEN }}" \
            --environment-variables \
                PHOTOFRAME_HOME=/app \
                SERVER_PORT=8082 \
                LOGGING_FILE_NAME=/app/logs/photoframe.log \
                LOG_LEVEL=INFO \
                PHOTOFRAME_STORAGE_PROVIDER=filesystem \
                PHOTOFRAME_STORAGE_ROOT=/app/data \
                PHOTOFRAME_STORAGE_GOOGLE_PREFIX=google-photos-cache \
                PHOTOFRAME_GOOGLE_CREDENTIALS=/app/google-photos-credentials.properties \
                PHOTOFRAME_GOOGLE_PICKED_FILE=/app/google-photos-picked.json \
                PHOTOFRAME_DISPLAY_SETTINGS=/app/slideshow-display.json \
                photoframe.source=google \
                GOOGLE_PHOTOS_CLIENT_ID="${{ secrets.GOOGLE_PHOTOS_CLIENT_ID }}" \
            --secure-environment-variables \
                GOOGLE_PHOTOS_CLIENT_SECRET="${{ secrets.GOOGLE_PHOTOS_CLIENT_SECRET }}" \
                GOOGLE_PHOTOS_REFRESH_TOKEN="${{ secrets.GOOGLE_PHOTOS_REFRESH_TOKEN }}"

      - name: Wait for startup
        run: sleep 35

      - name: Deployment status
        run: az container show -g "${{ env.AZURE_RESOURCE_GROUP }}" -n "${{ env.CONTAINER_NAME }}" --query "instanceView.state" -o tsv

      - name: Health check
        run: |
          URL="http://${{ env.DNS_LABEL }}.${{ env.AZURE_LOCATION }}.azurecontainer.io:8082/api/photos/config"
          echo "Checking ${URL}"
          for i in $(seq 1 12); do
            if curl -fsS "${URL}" >/dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt ${i}/12 — waiting..."
            sleep 10
          done
          echo "Health check failed" >&2
          exit 1

      - name: Access URLs
        run: |
          echo "Slideshow: http://${{ env.DNS_LABEL }}.${{ env.AZURE_LOCATION }}.azurecontainer.io:8082/"
          echo "Picker:    http://${{ env.DNS_LABEL }}.${{ env.AZURE_LOCATION }}.azurecontainer.io:8082/myphotoframe"
          echo "API:       http://${{ env.DNS_LABEL }}.${{ env.AZURE_LOCATION }}.azurecontainer.io:8082/api/photos/config"
